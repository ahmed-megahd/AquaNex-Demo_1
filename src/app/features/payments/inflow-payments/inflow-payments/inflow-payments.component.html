<p-breadcrumb [home]="home" [model]="items" />
<div class="main-content_top">
  <div class="title-container">
    <p class="page-title">Customer Payments</p>
  </div>

  <div class="cta">
    <p-button
      label="Record Payment"
      icon="pi pi-plus"
      size="large"
      (onClick)="openNew()"
    />
  </div>
</div>

<div class="main-content_center">
  <div class="search-header">
    <p>Searching Options based on your insights</p>
  </div>
  <div class="search-inputs">
    <div class="search-input-item">
      <p-datepicker
        placeholder="Creation Date"
        size="large"
        [(ngModel)]="creationDate"
        selectionMode="range"
        [iconDisplay]="'input'"
        [showIcon]="true"
      />
    </div>

    <div class="search-input-item">
      <p-multiselect
        [options]="paymentMethodOptions"
        [(ngModel)]="paymentMethod"
        placeholder="Payment Method"
        optionLabel="name"
        display="chip"
      />
    </div>
    <div class="cta">
      <p-button icon="pi pi-search" size="large" (onClick)="onSearch()" />
    </div>
  </div>
</div>

<div class="main-content_bottom">
  <div class="analysis-box">
    <div class="analysis-card">
      <p class="card-title">
        <i class="pi pi-check-circle total-closed"></i> total received
      </p>
      <p class="card-data">$48112</p>
    </div>
    <div class="analysis-card">
      <p class="card-title">
        <i class="pi pi-hourglass form-data-pending"></i>pending payables
      </p>
      <p class="card-data">$2290</p>
    </div>
    <div class="analysis-card">
      <p class="card-title">
        <i class="pi pi-calendar-times total-in-progress"></i>today
      </p>
      <p class="card-data">$18099</p>
    </div>
  </div>
  <div class="card">
    <div class="form-view">
      <app-data-table
        [columns]="columns"
        [value]="payments"
        [globalFilterFields]="['ID', 'category', 'department']"
        [selectionMode]="'multiple'"
        [exportable]="true"
        (onView)="onViewExpense($event)"
        (onEdit)="handleEdit($event)"
        (onDelete)="handleDelete($event)"
        (onDeleteSelected)="handleBulkDelete($event)"
      />
    </div>
  </div>
</div>
